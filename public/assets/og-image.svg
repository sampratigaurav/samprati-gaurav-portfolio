<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Bone paper background -->
  <rect width="1200" height="630" fill="#E9E3D4"/>
  
  <defs>
    <!-- Halftone dots pattern -->
    <pattern id="halftone" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="5" cy="5" r="2.5" fill="#17130D" fill-opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#halftone)"/>

  <!-- Huge Red Accent Circle (Hinomaru style) -->
  <circle cx="1000" cy="500" r="400" fill="#C62E22"/>

  <!-- Big S watermark (Ink) -->
  <text x="1000" y="550" font-family="Times New Roman, Georgia, serif" font-size="500" font-weight="bold" fill="#17130D" font-style="italic" text-anchor="middle">S</text>

  <!-- URL badge -->
  <rect x="80" y="80" width="220" height="50" fill="#17130D"/>
  <text x="190" y="113" font-family="monospace" font-size="24" fill="#E9E3D4" text-anchor="middle" font-weight="bold">samprati.dev</text>

  <!-- Content Box -->
  <rect x="80" y="160" width="840" height="360" fill="#E9E3D4" stroke="#17130D" stroke-width="6" />

  <!-- Name -->
  <text x="140" y="270" font-family="Times New Roman, Georgia, serif" font-size="96" font-weight="bold" fill="#17130D" font-style="italic">Samprati Gaurav</text>

  <!-- Tagline -->
  <text x="140" y="340" font-family="monospace" font-size="32" fill="#C62E22" font-weight="bold">Cybersecurity Student · Builder · Writer</text>

  <!-- Divider -->
  <line x1="140" y1="390" x2="620" y2="390" stroke="#17130D" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Stats -->
  <text x="140" y="445" font-family="monospace" font-size="24" fill="#17130D">15 articles  ·  159 commits  ·  6 certs  ·  1 live project</text>

  <!-- CTA -->
  <text x="140" y="495" font-family="monospace" font-size="20" fill="#17130D">Open to internships &amp; collaborations</text>
</svg>
