<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#17130D" stroke-width="2" stroke-opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="300" height="400" fill="url(#hatch)"/>
  
  <!-- Dog (Left, looking right) -->
  <path d="M 40 320 L 40 220 C 40 180, 70 140, 110 140 C 120 140, 130 145, 140 150 C 150 140, 160 160, 140 180 C 130 190, 120 200, 120 220 L 120 320 Z" fill="none" stroke="#17130D" stroke-width="8" stroke-linejoin="round"/>
  <!-- Dog ear -->
  <path d="M 70 140 L 80 80 L 110 140" fill="#17130D" stroke="#17130D" stroke-width="8" stroke-linejoin="round"/>
  <!-- Dog nose -->
  <circle cx="140" cy="150" r="8" fill="#17130D"/>
  
  <!-- Cat (Right, looking left) -->
  <path d="M 260 320 L 260 230 C 260 190, 230 160, 190 160 C 180 160, 170 165, 160 170 C 150 160, 140 175, 150 190 C 160 200, 170 210, 170 230 L 170 320 Z" fill="#17130D"/>
  <!-- Cat ears -->
  <path d="M 190 160 L 180 110 L 210 145" fill="#17130D"/>
  <path d="M 220 170 L 240 120 L 240 160" fill="#17130D"/>
  <!-- Cat tail -->
  <path d="M 260 290 C 290 290, 300 250, 280 220 C 270 200, 250 210, 260 230" fill="none" stroke="#17130D" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Red ball/yarn shared between them -->
  <circle cx="150" cy="90" r="14" fill="none" stroke="#C62E22" stroke-width="6"/>
  <path d="M 150 76 C 140 82, 160 102, 150 108" fill="none" stroke="#C62E22" stroke-width="3"/>
</svg>
