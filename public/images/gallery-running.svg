<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <pattern id="dot2" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#17130D" fill-opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="300" height="400" fill="url(#dot2)"/>

  <!-- Track lanes -->
  <path d="M 0 250 C 150 250, 250 150, 300 0" fill="none" stroke="#C62E22" stroke-width="20"/>
  <path d="M 0 300 C 150 300, 280 180, 300 40" fill="none" stroke="#17130D" stroke-width="4"/>
  <path d="M 0 350 C 150 350, 310 210, 300 80" fill="none" stroke="#17130D" stroke-width="4"/>

  <!-- Abstract Running Shoe -->
  <g transform="translate(10, 10)">
    <path d="M 50 220 C 50 170, 70 150, 100 150 L 120 160 L 160 170 C 190 180, 220 200, 220 220 C 220 240, 180 250, 100 250 C 60 250, 50 240, 50 220 Z" fill="#17130D"/>
    <!-- Laces -->
    <line x1="100" y1="150" x2="110" y2="130" stroke="#17130D" stroke-width="6" stroke-linecap="round"/>
    <line x1="120" y1="160" x2="135" y2="140" stroke="#17130D" stroke-width="6" stroke-linecap="round"/>
    <line x1="140" y1="165" x2="160" y2="150" stroke="#17130D" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Highlight / Swoosh -->
    <path d="M 80 200 C 120 200, 150 180, 180 180" fill="none" stroke="#E9E3D4" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
