<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <!-- Halftone grid -->
  <defs>
    <pattern id="grid3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#17130D" stroke-width="1" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="300" height="400" fill="url(#grid3)"/>

  <!-- Minimalist Running Track Curves -->
  <!-- 4 thick, sweeping concentric curves representing athletic track lanes -->
  <path d="M -50 380 C 150 380, 280 250, 380 -50" fill="none" stroke="#17130D" stroke-width="4"/>
  <path d="M -50 330 C 110 330, 230 210, 330 -50" fill="none" stroke="#C62E22" stroke-width="32"/>
  <path d="M -50 280 C 70 280, 180 170, 280 -50" fill="none" stroke="#17130D" stroke-width="4"/>
  <path d="M -50 230 C 30 230, 130 130, 230 -50" fill="none" stroke="#17130D" stroke-width="4"/>

  <!-- Stopwatch graphic overlapping the track -->
  <g transform="translate(150, 180)">
    <!-- Base -->
    <circle cx="0" cy="0" r="80" fill="#E9E3D4" stroke="#17130D" stroke-width="12"/>
    
    <!-- Top button -->
    <rect x="-16" y="-110" width="32" height="30" fill="#17130D"/>
    <rect x="-24" y="-120" width="48" height="10" fill="#17130D"/>

    <!-- Side Button -->
    <g transform="rotate(45)">
      <rect x="-10" y="-105" width="20" height="25" fill="#17130D"/>
    </g>

    <!-- Inner Dial -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#17130D" stroke-width="4" stroke-dasharray="4 8"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#17130D" stroke-width="2"/>

    <!-- Red Hand -->
    <line x1="0" y1="0" x2="30" y2="-40" stroke="#C62E22" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="10" fill="#17130D"/>
  </g>
</svg>
