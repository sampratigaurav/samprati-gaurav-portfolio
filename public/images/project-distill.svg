<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#17130D" stroke-width="0.5" stroke-opacity="0.1"/>
    </pattern>
    <pattern id="halftone" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#17130D" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#E9E3D4"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Outer Frame -->
  <rect x="6" y="6" width="788" height="488" fill="none" stroke="#17130D" stroke-width="1.5"/>
  <rect x="18" y="18" width="14" height="14" fill="#C62E22"/>

  <!-- App Container (offset shadow) -->
  <rect x="58" y="58" width="684" height="412" fill="#17130D"/>
  <rect x="50" y="50" width="684" height="412" fill="#E0D8C4" stroke="#17130D" stroke-width="1.5"/>

  <!-- Header -->
  <!-- Shield Icon -->
  <path d="M 80 80 L 106 80 L 106 95 C 106 108, 93 115, 93 115 C 93 115, 80 108, 80 95 Z" fill="none" stroke="#C62E22" stroke-width="1.5"/>
  <path d="M 86 95 L 91 100 L 100 89" fill="none" stroke="#C62E22" stroke-width="1.5"/>
  
  <text x="120" y="93" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="20" fill="#17130D">DISTILL</text>
  <text x="120" y="112" font-family="'JetBrains Mono', monospace" font-size="10" fill="#5A5140">UNIVERSAL DATA SANITIZATION &amp; POISONING DETECTION</text>

  <!-- System Online Badge -->
  <rect x="610" y="80" width="104" height="24" fill="#E9E3D4" stroke="#17130D" stroke-width="1.5" rx="2"/>
  <circle cx="622" cy="92" r="3" fill="#C62E22"/>
  <text x="632" y="96" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="9" fill="#17130D">SYSTEM ONLINE</text>

  <line x1="50" y1="135" x2="734" y2="135" stroke="#17130D" stroke-width="1.5" stroke-dasharray="4 2"/>

  <!-- Drag and Drop Area -->
  <rect x="110" y="165" width="564" height="90" fill="url(#halftone)" stroke="#17130D" stroke-width="1.5"/>
  
  <!-- Upload Icon -->
  <path d="M 392 185 L 392 205 M 384 193 L 392 185 L 400 193 M 382 210 L 402 210" fill="none" stroke="#17130D" stroke-width="2"/>
  
  <text x="392" y="225" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#17130D">Drag &amp; drop your file here</text>
  
  <text x="392" y="242" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#5A5140">
    <tspan fill="#C62E22">.csv</tspan> tabular data &#160;
    <tspan fill="#C62E22">.zip</tspan> image archives &#160;
    <tspan fill="#C62E22">.parquet</tspan> HuggingFace datasets
  </text>

  <!-- Input Field -->
  <text x="110" y="285" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#17130D">DESCRIBE NORMAL DATA <tspan fill="#5A5140" font-weight="normal">(optional - images only, uses CLIP zero-shot)</tspan></text>
  <rect x="110" y="295" width="564" height="34" fill="#E9E3D4" stroke="#17130D" stroke-width="1.5"/>
  <text x="120" y="316" font-family="'JetBrains Mono', monospace" font-size="11" fill="#5A5140">e.g. 'A photo of a man' - leave blank for unsupervised mode</text>

  <!-- Scan Button -->
  <rect x="110" y="345" width="150" height="36" fill="#17130D" rx="2"/>
  <path d="M 120 363 L 126 355 L 129 363 L 136 351" fill="none" stroke="#E9E3D4" stroke-width="1.5"/> 
  <text x="144" y="367" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="12" fill="#E9E3D4">SCAN DATASET</text>
  
  <text x="674" y="367" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9" fill="#5A5140">⟳ PROCESSED IN MEMORY - ZERO RETENTION</text>

  <line x1="50" y1="400" x2="734" y2="400" stroke="#17130D" stroke-width="1.5" stroke-dasharray="4 2"/>

  <!-- API Access -->
  <text x="80" y="420" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="11" fill="#17130D">API ACCESS</text>
  <rect x="80" y="430" width="624" height="42" fill="#E9E3D4" stroke="#17130D" stroke-width="1.5" stroke-dasharray="2 2"/>
  <text x="95" y="446" font-family="'JetBrains Mono', monospace" font-size="10" fill="#17130D">
    <tspan fill="#5A5140"># Scan a dataset programmatically</tspan>
  </text>
  <text x="95" y="460" font-family="'JetBrains Mono', monospace" font-size="10" fill="#17130D">
    curl -X POST https://api.distill.com/scan <tspan fill="#C62E22">-F</tspan> "file=@dataset.csv"
  </text>
</svg>
