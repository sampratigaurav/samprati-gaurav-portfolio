<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#17130D" stroke-width="1" stroke-opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="300" height="400" fill="url(#grid)"/>

  <!-- Tennis Racket -->
  <g transform="translate(150, 200) rotate(45)">
    <!-- Handle -->
    <rect x="-10" y="50" width="20" height="100" fill="#17130D"/>
    <path d="M -10 60 L 10 70 M -10 80 L 10 90 M -10 100 L 10 110 M -10 120 L 10 130" fill="none" stroke="#E9E3D4" stroke-width="2"/>
    <!-- Throat -->
    <path d="M -10 50 L -30 0 L -20 -10 L 0 20 L 20 -10 L 30 0 Z" fill="none" stroke="#17130D" stroke-width="8"/>
    <!-- Head -->
    <ellipse cx="0" cy="-60" rx="50" ry="70" fill="none" stroke="#17130D" stroke-width="10"/>
    <!-- Strings -->
    <path d="M -30 -100 L -30 -20 M -10 -120 L -10 0 M 10 -120 L 10 0 M 30 -100 L 30 -20" stroke="#17130D" stroke-width="1.5" stroke-opacity="0.5"/>
    <path d="M -40 -40 L 40 -40 M -45 -60 L 45 -60 M -45 -80 L 45 -80 M -35 -100 L 35 -100" stroke="#17130D" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>

  <!-- Tennis Ball with Speed Trail -->
  <path d="M 80 120 C 120 120, 180 140, 220 80" fill="none" stroke="#C62E22" stroke-width="4" stroke-dasharray="10 10"/>
  <circle cx="80" cy="120" r="16" fill="#E9E3D4" stroke="#17130D" stroke-width="6"/>
  <!-- Ball curves -->
  <path d="M 70 110 C 80 115, 80 125, 70 130 M 90 110 C 80 115, 80 125, 90 130" fill="none" stroke="#17130D" stroke-width="2"/>
</svg>
