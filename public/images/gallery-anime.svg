<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <pattern id="dot" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#17130D" fill-opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="300" height="400" fill="url(#dot)"/>
  
  <!-- Red Ribbon of Fate (Your Name) sweeping across the frame -->
  <path d="M 0 300 C 100 200, 200 400, 300 150" fill="none" stroke="#C62E22" stroke-width="12" stroke-linecap="round"/>
  <path d="M 50 350 C 120 280, 250 450, 300 200" fill="none" stroke="#C62E22" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 10"/>

  <!-- Kunai (Naruto) falling / stabbing down -->
  <g transform="translate(150, 180) rotate(45) scale(1.2)">
    <!-- Handle -->
    <rect x="-10" y="40" width="20" height="50" fill="#17130D"/>
    <!-- Handle Wrap Pattern (using simple lines) -->
    <path d="M -10 50 L 10 60 M -10 60 L 10 70 M -10 70 L 10 80 M -10 80 L 10 90" fill="none" stroke="#E9E3D4" stroke-width="3"/>
    <!-- Pommel ring -->
    <circle cx="0" cy="100" r="12" fill="none" stroke="#17130D" stroke-width="6"/>
    <!-- Blade guard -->
    <rect x="-20" y="30" width="40" height="10" fill="#17130D"/>
    <!-- Blade -->
    <path d="M -15 30 L 15 30 L 0 -40 Z" fill="#E9E3D4" stroke="#17130D" stroke-width="6" stroke-linejoin="round"/>
    <line x1="0" y1="30" x2="0" y2="-30" stroke="#17130D" stroke-width="4"/>
  </g>
</svg>
