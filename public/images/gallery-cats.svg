<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#17130D" stroke-opacity="0.2" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="300" height="400" fill="#E9E3D4"/>
  <rect width="300" height="400" fill="url(#hatch)"/>

  <!-- Cat Silhouette -->
  <!-- Body -->
  <path d="M 100 350 C 100 250, 150 220, 200 280 C 230 310, 240 350, 240 350 Z" fill="#17130D"/>
  <!-- Head -->
  <circle cx="170" cy="200" r="45" fill="#17130D"/>
  <!-- Ears -->
  <path d="M 130 180 L 120 120 L 160 160 Z" fill="#17130D"/>
  <path d="M 210 180 L 220 120 L 180 160 Z" fill="#17130D"/>
  <!-- Tail -->
  <path d="M 120 340 C 50 330, 40 230, 80 180" fill="none" stroke="#17130D" stroke-width="12" stroke-linecap="round"/>

  <!-- Red Yarn Ball -->
  <circle cx="220" cy="100" r="25" fill="none" stroke="#C62E22" stroke-width="4"/>
  <path d="M 210 80 C 230 90, 200 110, 230 120" fill="none" stroke="#C62E22" stroke-width="3"/>
  <path d="M 230 120 C 250 140, 260 200, 230 350" fill="none" stroke="#C62E22" stroke-width="3" stroke-dasharray="8 8"/>
</svg>
