<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#17130D" stroke-width="0.5" stroke-opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="300" height="400" fill="#E9E3D4"/>
  <rect width="300" height="400" fill="url(#grid)"/>

  <!-- Comet trailing from top right to bottom left -->
  <path d="M 350 -50 C 250 50, 150 150, -50 350" fill="none" stroke="#17130D" stroke-width="3" stroke-dasharray="10 15"/>
  <path d="M 320 -20 C 220 80, 120 180, -80 380" fill="none" stroke="#17130D" stroke-width="1.5" stroke-dasharray="5 10"/>

  <!-- Main Comet -->
  <path d="M 280 -10 C 180 90, 80 200, 40 260" fill="none" stroke="#C62E22" stroke-width="12" stroke-linecap="round"/>
  <circle cx="40" cy="260" r="14" fill="#C62E22"/>

  <!-- Splitting Fragment -->
  <path d="M 250 20 C 150 120, 70 190, 120 280" fill="none" stroke="#17130D" stroke-width="6" stroke-linecap="round"/>
  <circle cx="120" cy="280" r="8" fill="#17130D"/>

  <!-- Manga Starbursts -->
  <path d="M 200 100 L 210 105 L 205 115 L 195 110 Z" fill="#17130D"/>
  <path d="M 80 150 L 85 152 L 83 158 L 78 155 Z" fill="#C62E22"/>
</svg>
