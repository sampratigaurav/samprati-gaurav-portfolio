<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.5" fill="#17130D" fill-opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="400" height="500" fill="#E0D8C4"/>
  <rect width="400" height="500" fill="url(#grid2)"/>

  <!-- Connecting Lines -->
  <g stroke="#17130D" stroke-width="2" stroke-opacity="0.8">
    <line x1="100" y1="100" x2="250" y2="80"/>
    <line x1="250" y1="80" x2="320" y2="200"/>
    <line x1="320" y1="200" x2="200" y2="300"/>
    <line x1="200" y1="300" x2="80" y2="250"/>
    <line x1="80" y1="250" x2="100" y2="100"/>
    <line x1="100" y1="100" x2="200" y2="300"/>
    <line x1="80" y1="250" x2="320" y2="200"/>
    
    <line x1="200" y1="300" x2="250" y2="420"/>
    <line x1="250" y1="420" x2="120" y2="400"/>
    <line x1="120" y1="400" x2="80" y2="250"/>
  </g>

  <!-- Outer nodes (black) -->
  <circle cx="100" cy="100" r="6" fill="#17130D"/>
  <circle cx="250" cy="80" r="6" fill="#17130D"/>
  <circle cx="320" cy="200" r="6" fill="#17130D"/>
  <circle cx="80" cy="250" r="6" fill="#17130D"/>
  <circle cx="120" cy="400" r="6" fill="#17130D"/>
  <circle cx="250" cy="420" r="6" fill="#17130D"/>

  <!-- Central / Active Nodes (Red) -->
  <circle cx="200" cy="300" r="12" fill="#C62E22" stroke="#E0D8C4" stroke-width="4"/>
  
  <!-- Concentric pulses -->
  <circle cx="200" cy="300" r="25" fill="none" stroke="#C62E22" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="200" cy="300" r="40" fill="none" stroke="#C62E22" stroke-width="1.5" stroke-dasharray="2 6"/>

  <text x="215" y="285" font-family="'JetBrains Mono', monospace" font-size="10" fill="#17130D" font-weight="bold">PEER_CONN_ESTABLISHED</text>
  <rect x="215" y="295" width="40" height="2" fill="#C62E22"/>
</svg>
