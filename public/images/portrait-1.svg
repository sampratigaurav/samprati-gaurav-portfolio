<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#17130D" stroke-width="0.5" stroke-opacity="0.1"/>
    </pattern>
    <clipPath id="circle-clip">
      <circle cx="200" cy="200" r="140" />
    </clipPath>
  </defs>
  <rect width="400" height="400" fill="#E9E3D4"/>
  <rect width="400" height="400" fill="url(#grid)"/>

  <!-- Fingerprint concentric paths -->
  <g clip-path="url(#circle-clip)" fill="none" stroke="#17130D" stroke-width="6" stroke-linecap="round">
    <path d="M 150 300 C 100 200, 150 100, 250 150 C 300 200, 250 300, 200 350"/>
    <path d="M 130 320 C 70 200, 130 80, 270 140 C 330 200, 270 320, 210 370"/>
    <path d="M 170 280 C 130 200, 170 120, 230 160 C 270 200, 230 280, 190 320"/>
    <path d="M 190 260 C 160 200, 190 140, 210 170 C 240 200, 210 260, 195 280"/>
    <!-- Add more abstract curvy lines to look like a fingerprint -->
    <path d="M 100 250 C 50 150, 150 50, 300 120 C 350 250, 200 400, 150 350"/>
    <path d="M 200 220 C 180 180, 220 160, 220 190 C 220 220, 190 230, 200 250"/>
  </g>

  <!-- Red Laser Scan Line -->
  <line x1="20" y1="200" x2="380" y2="200" stroke="#C62E22" stroke-width="4"/>
  <rect x="20" y="200" width="360" height="40" fill="#C62E22" opacity="0.1"/>
  
  <text x="200" y="370" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#C62E22" font-weight="bold">IDENTITY_VERIFIED // 2026</text>
</svg>
