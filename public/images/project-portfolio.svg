<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Hatch pattern for the hero art placeholder -->
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#17130D" stroke-opacity="0.15" stroke-width="1"/>
    </pattern>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#17130D" stroke-width="0.5" stroke-opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#E9E3D4"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Outer Frame -->
  <rect x="6" y="6" width="788" height="488" fill="none" stroke="#17130D" stroke-width="1.5"/>
  <rect x="18" y="18" width="14" height="14" fill="#C62E22"/>

  <!-- App Container (offset shadow) -->
  <rect x="58" y="58" width="684" height="412" fill="#17130D"/>
  <rect x="50" y="50" width="684" height="412" fill="#E9E3D4" stroke="#17130D" stroke-width="1.5"/>
  
  <!-- Let's draw the portfolio UI inside this box -->
  
  <!-- Top Border line of Nav -->
  <line x1="50" y1="85" x2="734" y2="85" stroke="#17130D" stroke-width="1.5"/>

  <!-- Nav Text -->
  <circle cx="70" cy="67" r="4" fill="#C62E22"/>
  <text x="82" y="71" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="11" fill="#17130D">SAMPRATI GAURAV</text>

  <!-- Nav Links -->
  <text x="490" y="70" font-family="'JetBrains Mono', monospace" font-size="9" fill="#5A5140">/work &#160; /arcs &#160; /arsenal</text>
  
  <!-- Let's talk button -->
  <rect x="650" y="57" width="70" height="20" fill="#C62E22" rx="1"/>
  <text x="685" y="70" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="8" fill="#E9E3D4">Let's talk</text>

  <!-- Hero Section -->
  <text x="80" y="125" font-family="'JetBrains Mono', monospace" font-size="8" fill="#C62E22" font-weight="bold">■ PORTFOLIO — VOL.2026</text>
  
  <!-- Big Title -->
  <text x="80" y="185" font-family="'Instrument Serif', Georgia, serif" font-size="64" fill="#17130D">Samprati</text>
  <text x="80" y="245" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="64" fill="#C62E22">Gaurav</text>

  <!-- Paragraph lines -->
  <rect x="80" y="275" width="220" height="6" fill="#17130D" fill-opacity="0.2"/>
  <rect x="80" y="290" width="240" height="6" fill="#17130D" fill-opacity="0.2"/>
  <rect x="80" y="305" width="180" height="6" fill="#17130D" fill-opacity="0.2"/>
  
  <!-- Badges -->
  <rect x="80" y="330" width="70" height="20" fill="none" stroke="#17130D" stroke-width="1"/>
  <rect x="156" y="330" width="50" height="20" fill="none" stroke="#17130D" stroke-width="1"/>
  <rect x="212" y="330" width="50" height="20" fill="none" stroke="#17130D" stroke-width="1"/>
  
  <!-- Buttons -->
  <rect x="80" y="365" width="90" height="26" fill="#17130D" rx="2"/>
  <rect x="180" y="365" width="90" height="26" fill="none" stroke="#17130D" stroke-width="1.5" rx="2"/>

  <!-- Right Side Hero Image (The Artwork) -->
  <!-- Red semi-circle behind -->
  <path d="M 450 120 A 100 100 0 0 1 650 120 Z" fill="#C62E22"/>
  
  <!-- Shadow -->
  <rect x="424" y="134" width="230" height="280" fill="#17130D"/>
  
  <!-- Image Box -->
  <rect x="416" y="126" width="230" height="280" fill="#E0D8C4" stroke="#17130D" stroke-width="1.5"/>
  <!-- Inner Border -->
  <rect x="422" y="132" width="218" height="268" fill="url(#hatch)" stroke="#17130D" stroke-width="1.5"/>
  
  <!-- Little red square in top left of art -->
  <rect x="428" y="138" width="6" height="6" fill="#C62E22"/>
  
  <text x="531" y="266" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#17130D">HERO ART</text>

  <!-- Marquee at the very bottom of the app window -->
  <rect x="50" y="442" width="684" height="20" fill="#C62E22"/>
  <line x1="50" y1="442" x2="734" y2="442" stroke="#17130D" stroke-width="1.5"/>
  <text x="60" y="455" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="9" fill="#E9E3D4">REACT ❋ NODE.JS ❋ TYPESCRIPT ❋ CYBERSECURITY ❋ WEBRTC ❋ 700+ CONTRIBUTIONS</text>
  <text x="480" y="455" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="9" fill="#E9E3D4">REACT ❋ NODE.JS ❋ TYPESCRIPT ❋ WEBRTC</text>

</svg>
